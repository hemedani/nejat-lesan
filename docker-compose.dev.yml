services:
  # Backend service (development)
  backend:
    build:
      context: ./back
      target: development
    image: lesan-backend:dev
    volumes:
      - ./back:/app
      - /app/declarations # Exclude declarations directory from mounting
    environment:
      - APP_PORT=8000
      - ENV=development
      - MONGO_URI=mongodb://mongo:27017/mydatabase
      - REDIS_URI=redis://redis:6379

  # Frontend service (development)
  frontend:
    build:
      context: ./front
      target: development
    image: lesan-frontend:dev
    volumes:
      - ./front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - APP_PORT=3000
      - NODE_ENV=development

  # Vector tile archive server (PMTiles → ZXY MVT). Internal only.
  tiles-archive:
    image: protomaps/go-pmtiles:v1.31.2
    restart: unless-stopped
    command:
      [
        "serve",
        "/data",
        "--port=8080",
        "--public-url=http://localhost:8790",
        "--cors=*",
        "--cache-size=256",
      ]
    volumes:
      - tiles_data:/data

  # Vector tile web front (style, TileJSON, glyphs, sprites, areas, MVT proxy). Public.
  tiles-web:
    build:
      context: ./tiles
    image: lesan-tiles-web:latest
    restart: unless-stopped
    environment:
      - TILES_UPSTREAM=tiles-archive:8080
    ports:
      - "8790:8080"
    depends_on:
      - tiles-archive

volumes:
  frontend_node_modules:
  tiles_data:
    external: true
    name: lesan_tiles
