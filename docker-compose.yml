services:
  # Backend service
  backend:
    build:
      context: ./back
      target: production
    image: lesan-backend:latest
    restart: unless-stopped
    ports:
      - "1404:1404"
    env_file:
      - .env.backend
    environment:
      - SERVER_PORT=1404
      - TYPE_GENERATION=true
      - PLAYGROUND=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:4000,http://frontend:3000,http://lesan-frontend-1:3000,http://127.0.0.1:3000,http://127.0.0.1:4000,http://46.245.98.10:3795,https://46.245.98.10:3795,http://46.245.98.10,https://46.245.98.10
      - MONGO_URI=mongodb://mongo:27017/
      - REDIS_URI=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis

  # Frontend service
  frontend:
    build:
      context: ./front
      target: production
    image: lesan-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.frontend
    environment:
      - APP_PORT=3000
      - NODE_ENV=production
      - LESAN_URL=http://backend:1404
      - NEXT_PUBLIC_LESAN_URL=http://46.245.98.10:1404

  # MongoDB service
  mongo:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  # Redis service
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Vector tile archive server (PMTiles → ZXY MVT). Internal only.
  tiles-archive:
    image: protomaps/go-pmtiles:v1.31.2
    restart: unless-stopped
    command:
      [
        "serve",
        "/data",
        "--port=8080",
        "--public-url=http://46.245.98.10:8790",
        "--cors=*",
        "--cache-size=256",
      ]
    volumes:
      - tiles_data:/data
    healthcheck:
      test: ["CMD", "/go-pmtiles", "show", "/data/tiles.pmtiles", "--header-json"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vector tile web front (style, TileJSON, glyphs, sprites, areas, MVT proxy). Public.
  tiles-web:
    build:
      context: ./tiles
    image: lesan-tiles-web:latest
    restart: unless-stopped
    environment:
      - TILES_UPSTREAM=tiles-archive:8080
    ports:
      - "8790:8080"
    depends_on:
      - tiles-archive
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  tiles_data:
    external: true
    name: lesan_tiles
