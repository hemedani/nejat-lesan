()=>card('اطلاعات گزارش',`<div class="divider"></div><div class="info"><div><span>شناسه گزارش</span><b dir="ltr">${state.id}</b></div><div><span>نوع گزارش</span><b>تصادف</b></div><div><span>زمان ایجاد پرونده</span><b>${new Date(state.createdAt).toLocaleString('fa-IR')}</b></div><div><span>مأمور ثبت‌کننده</span><b>نسخه نمایشی · حساب متصل نیست</b></div></div>`)+card('موقعیت تأییدشده',`<div class="divider"></div>${locationSummary()}<button class="textbtn" data-go="0">اصلاح موقعیت</button>`)+card('زمان وقوع تصادف',`<div class="cols">${input('date',req('تاریخ وقوع (میلادی)'),'date')}${input('time',req('ساعت وقوع'),'time')}</div><p class="hint">معادل شمسی: <span id="persiandate">${state.date?new Date(state.date+'T12:00').toLocaleDateString('fa-IR'):'—'}</span></p>${area('notes','توضیحات (اختیاری)')}`),
()=>card(req('وضعیت تردد'),choice('traffic',[['عادی','≋'],['اختلال در تردد','≋'],['انسداد جزئی','▰'],['انسداد کامل','⊖']],false,true))+card(req('وضعیت‌های اضطراری صحنه'),'<p class="hint">امکان انتخاب چند مورد وجود دارد.</p>'+choice('emergency',[['حریق یا دود شدید','♨'],['واژگونی وسیله سنگین','▰'],['فرد محبوس','♙'],['مصدوم','✚'],['نشت سوخت یا مواد خطرناک','◈'],['ریزش بار در سطح راه','▦'],['مانع خطرناک در سواره‌رو','△'],['خطر انفجار','✹'],['سایر','⋯'],['وضعیت اضطراری وجود ندارد','✓']],true)+area('emergencyNotes','توضیح تکمیلی (اختیاری)'))+card('نیاز به پشتیبانی',choice('support',['اورژانس ۱۱۵','آتش‌نشانی','هلال احمر ۱۱۲','پلیس راه','اکیپ راهداری','یدک‌کش','جرثقیل'],true)+'<p class="hint">انتخاب پشتیبانی فقط نیاز به درخواست را ثبت می‌کند؛ درخواست اعزام ارسال نمی‌شود.</p>'),
()=>card(req('شدت تصادف'),choice('severity',[['خسارتی','▣'],['جرحی','✚'],['فوتی در صحنه','◉']]))+card(req('نوع برخورد'),choice('collision',[['برخورد با وسیله نقلیه','▣'],['واژگونی و سقوط','⤾'],['خروج از جاده','⑂'],['برخورد با شیء ثابت','▥'],['برخورد با عابر','♙'],['برخورد با موتورسیکلت','◌'],['برخورد با دوچرخه','◎'],['برخورد با حیوان','◇'],['برخورد با وسیله پارک‌شده','▣'],['چندبرخوردی','⋯'],['نامشخص','؟']])+ '<p class="hint">شدیدترین / نهایی‌ترین رخداد را ثبت کنید. خروج از مسیر و سپس واژگونی: «واژگونی و سقوط».</p>'),
()=>card(req('وضعیت روشنایی'),choice('lighting',[['روز','☀'],['طلوع','◒'],['غروب','◓'],['شب با روشنایی','☾'],['شب بدون روشنایی','◕']]))+card(req('وضع هوا'),choice('weather',[['صاف','☀'],['ابری','☁'],['بارانی','☂'],['برفی','❄'],['مه‌آلود','≡'],['غبارآلود','≋'],['باد شدید','≈'],['طوفان شن','≋']],false,true)),
()=>state.vehicles.map((v,i)=>`<section class="card"><div class="itemhead"><div><strong>وسیله نقلیه ${fa(i+1)}</strong><div class="muted">${esc(v.type||'نوع وسیله مشخص نشده')} · ${esc(plateText(v)||'پلاک ثبت نشده')}</div></div><button class="textbtn" data-edit-vehicle="${i}">ویرایش</button></div><div class="row" style="margin-top:14px"><span class="badge">${esc(v.mobility||'وضعیت حرکت نامشخص')}</span><span class="badge">${fa(v.attachments.length)} مدرک</span><button class="textbtn danger-text" data-delete-vehicle="${i}">حذف</button></div></section>`).join('')+(state.vehicles.length?'':'<div class="card empty">هنوز وسیله‌ای ثبت نشده است.</div>')+'<button class="add" data-action="addVehicle">＋ افزودن وسیله نقلیه</button>',
()=>state.vehicles.map((v,i)=>`<section class="card"><h3>وسیله نقلیه ${fa(i+1)} · ${esc(v.type||'نامشخص')}</h3><p class="muted">${esc(plateText(v))}</p><div class="divider"></div><div class="itemhead"><div><strong>راننده</strong><div class="muted">${esc(v.driver.presence||'وضعیت راننده ثبت نشده')}</div></div><button class="textbtn" data-edit-driver="${i}">${v.driver.presence?'ویرایش':'تکمیل اطلاعات'}</button></div><div class="divider"></div><div class="itemhead"><strong>سرنشینان</strong><button class="textbtn" data-add-passenger="${i}">＋ افزودن</button></div>${v.passengers.length?v.passengers.map((p,j)=>`<div class="itemhead"><span class="muted">سرنشین ${fa(j+1)} · ${esc(p.health||'ثبت نشده')}</span><button class="textbtn" data-edit-passenger="${i},${j}">ویرایش</button></div>`).join(''):'<p class="muted">بدون سرنشین</p>'}</section>`).join('')+(state.vehicles.length?'':'<div class="notice">ابتدا وسایل نقلیه را ثبت کنید.</div>')+state.pedestrians.map((p,i)=>`<div class="card itemhead"><span>عابر ${fa(i+1)} · ${esc(p.health||'ثبت نشده')}</span><button class="textbtn" data-edit-ped="${i}">ویرایش</button></div>`).join('')+'<button class="add" data-action="addPed">＋ افزودن عابر پیاده</button>',
()=>card(req('آیا به تجهیزات راه آسیبی وارد شده است؟'),choice('hasDamage',['بله','خیر']))+(state.hasDamage==='بله'?state.damages.map((d,i)=>`<div class="card summary"><div><h3>${esc(d.type||'آسیب جدید')}</h3><p>${esc(d.description||'شرح آسیب ثبت نشده')}</p><span class="badge">${fa(d.attachments.length)} مدرک</span></div><div><button class="textbtn" data-edit-damage="${i}">ویرایش</button><button class="textbtn danger-text" data-delete-damage="${i}">حذف</button></div></div>`).join('')+'<button class="add" data-action="addDamage">＋ افزودن آسیب</button>':''),
()=>review()
];
function plateText(v){if(v.plateType==='فاقد پلاک / نامشخص')return v.plateType;return (v.plate||[]).filter(Boolean).join(' ـ ')}
function heavy(v){return ['وانت بار','کامیونت','کامیون','تریلی','تانکر حمل مواد خطرناک'].includes(v.type)}
function vehicleForm(i){let p='vehicles.'+i,v=state.vehicles[i];return card(req('نوع وسیله نقلیه'),choice(p+'.type',['سواری','وانت بار','موتورسیکلت','مینی‌بوس','اتوبوس','کامیونت','کامیون','تریلی','تانکر حمل مواد خطرناک','خودروی آتش‌نشانی','سایر'],false,true))+card(req('پلاک'),choice(p+'.plateType',['ملی','موتورسیکلت','منطقه آزاد','گذر موقت / خاص','فاقد پلاک / نامشخص'],false,true)+plateFields(i))+card('اطلاعات تکمیلی',heavy(v)?select(p+'.cargo',req('نوع بار'),['بدون بار','مواد سوختی','محصولات کشاورزی','مصالح ساختمانی','مواد خطرناک','سایر']):'<p class="hint">نوع بار برای این وسیله کاربرد ندارد.</p>')+card(req('وضعیت جابه‌جایی پس از تصادف'),choice(p+'.mobility',['قابل حرکت','نیاز به یدک‌کش','نیاز به جرثقیل']))+files(p+'.attachments')}
function plateFields(i){let v=state.vehicles[i],p='vehicles.'+i+'.plate';if(!v.plateType||v.plateType==='فاقد پلاک / نامشخص')return '';let fields=v.plateType==='ملی'?[['دو رقم',2],['حرف',1],['سه رقم',3],['ایران',2]]:v.plateType==='موتورسیکلت'?[['سه رقم',3],['پنج رقم',5]]:v.plateType==='منطقه آزاد'?[['کد منطقه',0],['شماره',5]]:[['شناسه / حرف',0],['شماره',0]];return `<div class="plate"><div class="iran">IR<br>IRAN</div>`+fields.map((f,j)=>`<div><label for="${p}.${j}">${f[0]}</label>${v.plateType==='ملی'&&j===1?`<select id="${p}.${j}" data-field="${p}.${j}"><option value="">—</option>${['ب','ج','د','س','ص','ط','ق','ل','م','ن','و','ه','ی','ت','ع','ک','ژ','پ','ث','ز','ف','ش','گ'].map(x=>`<option ${v.plate[j]===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input aria-label="${f[0]}" id="${p}.${j}" data-field="${p}.${j}" value="${esc(v.plate[j]||'')}" ${f[1]?'inputmode="numeric" maxlength="'+f[1]+'"':''}>`}</div>`).join('')+'</div>'}
function driverForm(i){let p='vehicles.'+i+'.driver';return card(req('وضعیت حضور راننده'),choice(p+'.presence',['در صحنه حضور دارد','متواری شده است','در صحنه فوت شده','به بیمارستان منتقل شده']))+card('وضعیت فرد',choice(p+'.health',['سالم','مصدوم','فوتی در صحنه','نامشخص'])+select(p+'.gender','جنسیت',['مرد','زن','نامشخص']))+card('آیا مدارک راننده در دسترس است؟',choice(p+'.documents',['بله','خیر'])+(get(p+'.documents')==='بله'?files(p+'.attachments'):'')+'<p class="hint">اطلاعات هویتی در دفتر و از روی مدارک تکمیل می‌شود.</p>')}
function personForm(path){return card(req('وضعیت فرد'),choice(path+'.health',['سالم','مصدوم','فوتی در صحنه','نامشخص'])+select(path+'.gender','جنسیت',['مرد','زن','نامشخص']))+`<button class="textbtn danger-text" data-remove-person="${path}">حذف این فرد</button>`}
function damageForm(i){let p='damages.'+i;return card(req('نوع تجهیزات راه'),choice(p+'.type',['گاردریل','تابلو علامت','نیوجرسی بتنی','پایه روشنایی','دوربین','حصار','سایر'],false,true)+(get(p+'.type')==='سایر'?input(p+'.other',req('عنوان تجهیز')):''))+card(req('شرح آسیب'),area(p+'.description','شرح کوتاه خسارت'))+card('وسیله نقلیه مرتبط',`<label for="damageVehicle">وسیله مرتبط با این خسارت</label><select id="damageVehicle" data-field="${p}.vehicleId"><option value="">نامشخص</option>${state.vehicles.map((v,j)=>`<option value="${v.id}" ${v.id===get(p+'.vehicleId')?'selected':''}>وسیله ${fa(j+1)} · ${esc(v.type)} · ${esc(plateText(v))}</option>`).join('')}</select><p class="hint">موقعیت این آسیب از محل واقعه گرفته می‌شود.</p>`)+files(p+'.attachments')}
function openSheet(kind,index,sub){sheet={kind,index,sub};renderSheet();document.body.style.overflow='hidden'}
function renderSheet(){if(!sheet)return;let {kind,index,sub}=sheet,body,title;if(kind==='vehicle'){body=vehicleForm(index);title='وسیله نقلیه '+fa(index+1)}if(kind==='driver'){body=driverForm(index);title='راننده وسیله '+fa(index+1)}if(kind==='passenger'){body=personForm(`vehicles.${index}.passengers.${sub}`);title='سرنشین وسیله '+fa(index+1)}if(kind==='ped'){body=personForm(`pedestrians.${index}`);title='عابر پیاده '+fa(index+1)}if(kind==='damage'){body=damageForm(index);title='ثبت آسیب تجهیزات راه'}document.getElementById('panels').innerHTML=`<div class="sheetbg"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheethead"><h2>${title}</h2><button class="textbtn" data-action="closeSheet">بستن</button></div><div id="sheeterror" role="alert"></div>${body}<div class="footer"><button class="primary" data-action="saveSheet">ذخیره اطلاعات</button></div></section></div>`;hydrateFiles();document.querySelector('.sheet button')?.focus()}
function closeSheet(){sheet=null;document.getElementById('panels').innerHTML='';document.body.style.overflow='';render()}
function vehErrors(v){let e=[];if(!v.type)e.push('نوع وسیله نقلیه را انتخاب کنید.');if(!v.plateType)e.push('نوع پلاک را انتخاب کنید.');if(v.plateType==='ملی'&&!/^\d{2}$/.test(digits(v.plate[0]||''))||v.plateType==='ملی'&&(!v.plate[1]||!/^\d{3}$/.test(digits(v.plate[2]||''))||!/^\d{2}$/.test(digits(v.plate[3]||''))))e.push('پلاک ملی باید شامل دو رقم، حرف، سه رقم و کد دو رقمی ایران باشد.');if(v.plateType==='موتورسیکلت'&&(!/^\d{3}$/.test(digits(v.plate[0]||''))||!/^\d{5}$/.test(digits(v.plate[1]||''))))e.push('پلاک موتورسیکلت باید شامل سه رقم و پنج رقم باشد.');if(['منطقه آزاد','گذر موقت / خاص'].includes(v.plateType)&&(!v.plate[0]?.trim()||!v.plate[1]?.trim()))e.push('بخش‌های پلاک را تکمیل کنید.');if(v.plateType==='منطقه آزاد'&&!/^\d{5}$/.test(digits(v.plate[1]||'')))e.push('شماره منطقه آزاد باید پنج رقم باشد.');if(!v.mobility)e.push('وضعیت جابه‌جایی را انتخاب کنید.');if(heavy(v)&&!v.cargo)e.push('نوع بار را انتخاب کنید.');return e}
function damageErrors(d){return [...(!d.type?['نوع تجهیز را انتخاب کنید.']:[]),...(!d.description?.trim()?['شرح آسیب را وارد کنید.']:[]),...(d.type==='سایر'&&!d.other?.trim()?['عنوان تجهیز را وارد کنید.']:[])]}
function errors(step){let e=[],s=state,l=s.location;if(step===0){if(!l.lat||!l.lng||!isFinite(l.lat)||!isFinite(l.lng)||Math.abs(l.lat)>90||Math.abs(l.lng)>180)e.push('یک موقعیت معتبر روی نقشه یا با GPS انتخاب کنید.');if(!l.lane)e.push('خط یا شانه را انتخاب کنید.')}if(step===1){if(!l.confirmed)e.push('موقعیت واقعه هنوز تأیید نشده است.');if(!s.date||!s.time||isNaN(new Date(s.date+'T'+s.time)))e.push('تاریخ و ساعت وقوع معتبر وارد کنید.');else if(new Date(s.date+'T'+s.time)>new Date(Date.now()+60000))e.push('زمان وقوع نمی‌تواند در آینده باشد.')}if(step===2){if(!s.traffic)e.push('وضعیت تردد را انتخاب کنید.');if(!s.emergency.length)e.push('وضعیت اضطراری یا «وجود ندارد» را انتخاب کنید.')}if(step===3){if(!s.severity)e.push('شدت تصادف را انتخاب کنید.');if(!s.collision)e.push('نوع برخورد را انتخاب کنید.')}if(step===4){if(!s.lighting)e.push('روشنایی را انتخاب کنید.');if(!s.weather)e.push('وضع هوا را انتخاب کنید.')}if(step===5){if(!s.vehicles.length)e.push('حداقل یک وسیله نقلیه ثبت کنید.');s.vehicles.forEach((v,i)=>vehErrors(v).forEach(t=>e.push('وسیله '+fa(i+1)+': '+t)))}if(step===6){s.vehicles.forEach((v,i)=>{if(!v.driver.presence)e.push('وضعیت راننده وسیله '+fa(i+1)+' ثبت نشده است.');v.passengers.forEach((p,j)=>{if(!p.health)e.push('وضعیت سرنشین '+fa(j+1)+' وسیله '+fa(i+1)+' را تکمیل کنید.')})});s.pedestrians.forEach((p,i)=>{if(!p.health)e.push('وضعیت عابر '+fa(i+1)+' را تعیین کنید.')})}if(step===7){if(!s.hasDamage)e.push('وجود یا نبود آسیب تجهیزات را مشخص کنید.');if(s.hasDamage==='بله'){if(!s.damages.length)e.push('حداقل یک آسیب ثبت کنید.');s.damages.forEach((d,i)=>damageErrors(d).forEach(t=>e.push('آسیب '+fa(i+1)+': '+t)))}}return e}
function warnings(){let s=state,people=[...s.vehicles.flatMap(v=>[v.driver,...v.passengers]),...s.pedestrians],inj=people.some(p=>p.health==='مصدوم'),dead=people.some(p=>p.health==='فوتی در صحنه'||p.presence==='در صحنه فوت شده'),w=[];if(s.severity==='خسارتی'&&(inj||dead))w.push('شدت خسارتی با وجود مصدوم یا فوتی سازگار نیست.');if(s.severity==='جرحی'&&(!inj||dead))w.push('شدت جرحی را با وضعیت افراد تطبیق دهید.');if(s.severity==='فوتی در صحنه'&&!dead)w.push('هیچ فوتی در بخش افراد ثبت نشده است.');if(s.collision==='برخورد با وسیله نقلیه'&&s.vehicles.length<2)w.push('برای برخورد با وسیله نقلیه تنها یک وسیله ثبت شده است.');if(s.collision==='برخورد با عابر'&&!s.pedestrians.length)w.push('نوع برخورد با عابر است ولی عابری ثبت نشده است.');for(let v of s.vehicles){if(v.mobility==='نیاز به جرثقیل'&&!s.support.includes('جرثقیل'))w.push('وسیله نیاز به جرثقیل دارد اما این پشتیبانی انتخاب نشده است.');if(v.mobility==='نیاز به یدک‌کش'&&!s.support.includes('یدک‌کش'))w.push('نیاز به یدک‌کش را در پشتیبانی کنترل کنید.')}if(s.vehicles.some(v=>!v.attachments.length))w.push('برخی وسایل نقلیه فاقد مستندات هستند.');if(s.hasDamage==='بله'&&s.damages.some(d=>!d.attachments.length))w.push('برخی آسیب‌های تجهیزات فاقد تصویر هستند.');return [...new Set(w)]}
function review(){let s=state,sums=['',`${s.date?new Date(s.date+'T12:00').toLocaleDateString('fa-IR'):''} · ${s.time} | ${s.location.direction} · ${s.location.lane}`,`${s.traffic||'تکمیل نشده'} | ${s.support.join('، ')||'بدون درخواست پشتیبانی'}`,`${s.severity||'شدت نامشخص'} | ${s.collision||'نوع برخورد نامشخص'}`,`${s.lighting||'تعیین نشده'} | ${s.weather||'تعیین نشده'}`,`${fa(s.vehicles.length)} وسیله نقلیه · ${s.vehicles.map(v=>v.type).filter(Boolean).join('، ')}`,`${fa(s.vehicles.length)} راننده · ${fa(s.vehicles.reduce((a,v)=>a+v.passengers.length,0))} سرنشین · ${fa(s.pedestrians.length)} عابر`,s.hasDamage==='خیر'?'آسیبی ثبت نشده':`${fa(s.damages.length)} آسیب · ${s.damages.map(d=>d.type).join('، ')}`];return (s.status==='pending'?'<div class="success"><h2>گزارش روی دستگاه آماده ارسال است</h2><p>هنوز به سرور ارسال نشده است. خروجی گزارش و مستندات را دریافت کنید.</p></div>':'')+sums.slice(1).map((v,j)=>{let i=j+1,e=errors(i);return `<section class="card summary"><div><h3>${titles[i]}</h3><p>${esc(v)}</p>${e.map(t=>`<div class="error">${esc(t)}</div>`).join('')}</div><button class="textbtn" data-review-edit="${i}">ویرایش</button></section>`}).join('')+warnings().map(t=>'<div class="notice">'+esc(t)+'</div>').join('')+card('توضیحات و مستندات تکمیلی',area('finalNotes','توضیحات نهایی (اختیاری)')+files('attachments'))+'<div class="notice">این نسخه به سرور متصل نیست. تأیید نهایی، گزارش را فقط روی همین دستگاه در وضعیت «آماده ارسال» نگه می‌دارد.</div><label class="check"><input type="checkbox" id="confirmFinal">اطلاعات و هشدارهای گزارش را بازبینی کرده‌ام.</label><button class="outline" style="width:100%;margin-top:15px" data-action="export">دریافت فایل گزارش و مستندات</button>'}
let baseLayer,sat=false;function initMap(){if(!window.L){document.getElementById('map').innerHTML='<div class="empty">نقشه در دسترس نیست؛ از GPS یا ورود مختصات استفاده کنید.</div>';return}let l=state.location;map=L.map('map',{zoomControl:false}).setView(l.lat&&l.lng?[+l.lat,+l.lng]:[30.86,48.94],l.lat?16:10);L.control.zoom({position:'topleft'}).addTo(map);setLayer();if(l.officer)showOfficer();map.on('moveend',()=>{let c=map.getCenter();l.lat=+c.lat.toFixed(6);l.lng=+c.lng.toFixed(6);l.confirmed=false;updateLocation();save()});setTimeout(()=>map?.invalidateSize(),100)}
function setLayer(){if(baseLayer&&map)map.removeLayer(baseLayer);baseLayer=L.tileLayer(sat?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}':'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:sat?'Tiles © Esri':'© OpenStreetMap contributors'}).addTo(map);baseLayer.on('tileerror',()=>{let x=document.getElementById('maphint');if(x)x.textContent='نقشه بارگیری نشد؛ اتصال اینترنت را بررسی کنید یا از GPS / ورود مختصات استفاده کنید.'})}
function showOfficer(){if(officerMarker)officerMarker.remove();let l=state.location;officerMarker=L.marker(l.officer,{icon:L.divIcon({className:'pin-icon',iconSize:[16,16]})}).addTo(map).bindTooltip('موقعیت مأمور');L.circle(l.officer,{radius:l.accuracy||10,color:'#2c86e6',weight:1,fillOpacity:.08}).addTo(map)}
function updateLocation(){let x=document.getElementById('locsummary');if(x)x.innerHTML=locationSummary();let l=state.location;if(l.officer&&map&&l.lat){let d=map.distance(l.officer,[l.lat,l.lng]);document.getElementById('maphint').textContent='فاصله مأمور تا واقعه: '+fa(Math.round(d))+' متر'}}
function gps(){if(!navigator.geolocation){toast('مرورگر از موقعیت‌یابی پشتیبانی نمی‌کند.');return}toast('در حال دریافت موقعیت…');navigator.geolocation.getCurrentPosition(p=>{let l=state.location;l.officer=[p.coords.latitude,p.coords.longitude];l.accuracy=p.coords.accuracy;l.gpsAt=new Date().toISOString();l.lat=p.coords.latitude;l.lng=p.coords.longitude;l.confirmed=false;if(map){map.setView(l.officer,17);showOfficer()}updateLocation();save()},()=>toast('موقعیت دریافت نشد؛ دسترسی موقعیت را فعال کنید یا محل را روی نقشه انتخاب کنید.'),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
async function hydrateFiles(){for(let el of document.querySelectorAll('[data-file]')){let id=el.dataset.file;try{if(!mediaURLs.has(id)){let f=await dbget('files',id);if(f)mediaURLs.set(id,URL.createObjectURL(f.blob))}let u=mediaURLs.get(id);if(u){let img=el.querySelector('img');if(img)img.src=u;el.querySelector('a').href=u}else el.querySelector('a').textContent+=' (در دسترس نیست)'}catch{}}}
async function upload(el){if(!db){toast('ذخیره فایل در این مرورگر در دسترس نیست.');return}let path=el.dataset.upload,a=get(path);for(let f of el.files){if(f.size>20*1024*1024){toast('فایل '+f.name+' بزرگ‌تر از ۲۰ مگابایت است.');continue}if(!/^(image\/|video\/|application\/pdf$)/.test(f.type)){toast('نوع فایل پشتیبانی نمی‌شود.');continue}let id=uid();try{await dbput('files',id,{blob:f,name:f.name,type:f.type});a.push({id,name:f.name,type:f.type,size:f.size})}catch{toast('ذخیره فایل انجام نشد؛ فضای دستگاه را بررسی کنید.')}}await save();if(sheet)renderSheet();else render()}
function navigate(i){if(i===state.step)return;state.step=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
async function exportReport(){try{toast('در حال آماده‌سازی خروجی و مستندات…');let data=structuredClone(state);data.exportedAt=new Date().toISOString();data.serverSynced=false;data.files=[];let ids=new Set();function walk(o){if(!o||typeof o!=='object')return;if(o.id&&o.name&&o.type)ids.add(o.id);Object.values(o).forEach(v=>{if(typeof v==='object')walk(v)})}walk(state);for(let id of ids){let f=await dbget('files',id);if(f){let dataUrl=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f.blob)});data.files.push({id,name:f.name,type:f.type,dataUrl})}}let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=state.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('خروجی گزارش آماده شد؛ فایل شامل مستندات است.')}catch{toast('ساخت خروجی انجام نشد؛ فضای حافظه را بررسی کنید.')}}
document.addEventListener('input',e=>{let p=e.target.dataset.field;if(!p)return;put(p,e.target.value);if(p.startsWith('location.'))state.location.confirmed=false;if(p==='date'){let x=document.getElementById('persiandate');if(x)x.textContent=e.target.value?new Date(e.target.value+'T12:00').toLocaleDateString('fa-IR'):'—'}save()});
document.addEventListener('change',e=>{if(e.target.dataset.upload)upload(e.target)});
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.choice){let p=d.choice,v=d.value;if(d.multi==='true'){let a=get(p)||[];a=a.includes(v)?a.filter(x=>x!==v):[...a,v];if(p==='emergency')a=v==='وضعیت اضطراری وجود ندارد'?[v]:a.filter(x=>x!=='وضعیت اضطراری وجود ندارد');put(p,a);if(p==='support')state.supportOverrides[v]=a.includes(v)}else put(p,v);if(p==='hasDamage'&&v==='خیر'&&state.damages.length){put(p,'بله');confirmation('آسیب‌های ثبت‌شده نگهداری می‌شوند اما در گزارش فعال نخواهند بود. ادامه می‌دهید؟',()=>{state.hasDamage='خیر';save();render()});return}if(p==='traffic'||p==='emergency')calcSupport();if(p.endsWith('.plateType'))put(p.replace('plateType','plate'),[]);if(p.endsWith('.presence')&&v==='در صحنه فوت شده')put(p.replace('presence','health'),'فوتی در صحنه');if(p.startsWith('location.'))state.location.confirmed=false;save();if(sheet)renderSheet();else render();return}
if(d.go!==undefined){navigate(+d.go);return}if(d.reviewEdit!==undefined){returnReview=true;navigate(+d.reviewEdit);return}if(d.editVehicle!==undefined){openSheet('vehicle',+d.editVehicle);return}if(d.editDriver!==undefined){openSheet('driver',+d.editDriver);return}if(d.editDamage!==undefined){openSheet('damage',+d.editDamage);return}if(d.editPed!==undefined){openSheet('ped',+d.editPed);return}if(d.addPassenger!==undefined){let i=+d.addPassenger;state.vehicles[i].passengers.push({id:uid(),health:'',gender:''});save();openSheet('passenger',i,state.vehicles[i].passengers.length-1);return}if(d.editPassenger!==undefined){let [i,j]=d.editPassenger.split(',').map(Number);openSheet('passenger',i,j);return}
if(d.deleteVehicle!==undefined){let i=+d.deleteVehicle,v=state.vehicles[i];confirmation('این وسیله و اطلاعات راننده و سرنشینان آن حذف می‌شوند. ارتباط آسیب‌های تجهیزات با این وسیله نیز پاک می‌شود.',()=>{state.vehicles.splice(i,1);state.damages.forEach(x=>{if(x.vehicleId===v.id)x.vehicleId=''});save();render()});return}if(d.deleteDamage!==undefined){confirmation('این رکورد آسیب حذف شود؟',()=>{state.damages.splice(+d.deleteDamage,1);save();render()});return}if(d.removePerson){let a=d.removePerson.split('.'),i=+a.pop();get(a.join('.')).splice(i,1);save();closeSheet();return}if(d.removeFile){let p=d.path;put(p,get(p).filter(f=>f.id!==d.removeFile));await save();if(sheet)renderSheet();else render();return}
let action=d.action;if(action==='gps')gps();if(action==='satellite'){sat=!sat;if(map)setLayer();b.textContent=sat?'نقشه پایه':'لایه ماهواره‌ای'}if(action==='manualLocation'){let er=errors(0).filter(x=>!x.includes('شانه'));if(er.length)toast(er[0]);else{if(map)map.setView([+state.location.lat,+state.location.lng],16);updateLocation();save()}}if(action==='export')exportReport();if(action==='prev')navigate(Math.max(0,state.step-1));if(action==='closeSheet')closeSheet();if(action==='saveSheet'){let s=sheet,er=s.kind==='vehicle'?vehErrors(state.vehicles[s.index]):s.kind==='damage'?damageErrors(state.damages[s.index]):s.kind==='driver'?!state.vehicles[s.index].driver.presence?['وضعیت حضور راننده را مشخص کنید.']:[]:s.kind==='passenger'?!state.vehicles[s.index].passengers[s.sub].health?['وضعیت فرد را مشخص کنید.']:[]:!state.pedestrians[s.index].health?['وضعیت فرد را مشخص کنید.']:[];if(er.length){document.getElementById('sheeterror').innerHTML=er.map(x=>'<div class="error">'+x+'</div>').join('');document.querySelector('.sheet').scrollTop=0}else{await save();closeSheet()}}
if(action==='addVehicle'){state.vehicles.push({id:uid(),type:'',plateType:'',plate:[],mobility:'',cargo:'',attachments:[],driver:{presence:'',health:'',gender:'',documents:'',attachments:[]},passengers:[]});await save();openSheet('vehicle',state.vehicles.length-1)}if(action==='addPed'){state.pedestrians.push({id:uid(),health:'',gender:''});save();openSheet('ped',state.pedestrians.length-1)}if(action==='addDamage'){state.damages.push({id:uid(),type:'',description:'',vehicleId:'',location:{lat:state.location.lat,lng:state.location.lng},attachments:[]});save();openSheet('damage',state.damages.length-1)}if(action==='next'){let er=state.step===8?[0,1,2,3,4,5,6,7].flatMap(errors):errors(state.step);if(state.step===8&&!document.getElementById('confirmFinal').checked)er.push('تأیید بازبینی گزارش را انتخاب کنید.');if(er.length){document.getElementById('errors').innerHTML=er.map(t=>'<div class="error">'+esc(t)+'</div>').join('');window.scrollTo({top:0,behavior:'smooth'});return}if(state.step===0){state.location.confirmed=true;state.location.confirmedAt=new Date().toISOString();state.damages.forEach(d=>d.location={lat:state.location.lat,lng:state.location.lng})}if(state.step===8){try{if(!db)throw Error();state.status='pending';state.finalizedAt=new Date().toISOString();await dbput('reports','current',structuredClone(state));render();window.scrollTo(0,0);toast('گزارش محلی آماده ارسال شد؛ هنوز به سرور ارسال نشده است.')}catch{state.status='draft';toast('ذخیره نهایی انجام نشد. خروجی گزارش را دریافت کنید.')}return}if(returnReview){returnReview=false;navigate(8)}else navigate(state.step+1)}
});
let confirmationAction;function confirmation(text,fn){confirmationAction=fn;document.getElementById('panels').innerHTML=`<div class="sheetbg"><section class="sheet" role="dialog" aria-modal="true" aria-label="تأیید تغییر"><h2>تأیید تغییر</h2><p style="margin:22px 0">${esc(text)}</p><div class="row"><button class="primary" id="confirmYes">تأیید</button><button id="confirmNo">انصراف</button></div></section></div>`;document.getElementById('confirmYes').onclick=()=>{document.getElementById('panels').innerHTML='';fn()};document.getElementById('confirmNo').onclick=()=>document.getElementById('panels').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet();if(e.key==='Tab'){let box=document.querySelector('.sheet');if(!box)return;let a=[...box.querySelectorAll('button,input:not([type=file]),select,textarea,a[href]')].filter(x=>!x.disabled);if(!a.length)return;let f=a[0],l=a.at(-1);if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
if(document.modelContext?.registerTool){const lifecycle=new AbortController();for(const tool of [{name:'read_report_validation',description:'Read current local report completion and validation warnings without changing data.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>({id:state.id,step:state.step,status:state.status,errors:[0,1,2,3,4,5,6,7].flatMap(errors),warnings:warnings()})},{name:'navigate_report_section',description:'Navigate to a section of the local report. Does not submit or finalize the report.',inputSchema:{type:'object',properties:{section:{type:'integer',minimum:0,maximum:8}},required:['section'],additionalProperties:false},annotations:{readOnlyHint:false},execute:async input=>{if(!Number.isInteger(input.section)||input.section<0||input.section>8)throw Error('Invalid section');navigate(input.section);return {section:state.step,title:titles[state.step]}}}])try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{})}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true})}
init();
</script></body></html>
